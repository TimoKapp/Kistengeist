NAME="Cowork und Dispatch (Handy)"
DESCRIPTION="Wie in der Original-App: Aufgaben vom Handy per Dispatch an den Pi schicken und längere Arbeiten in Cowork erledigen. Nutzt eine virtuelle Maschine (QEMU/KVM, vom Pi-4-Kernel unterstützt)."
GROUP="Handy"
ORDER=70
DEFAULT=on
DEPENDS="claude-desktop"
NOTE="Braucht spürbar RAM (8-GB-Pi empfohlen) und ist auf dem Pi noch ungetestet. Dispatch braucht ein Pro- oder Max-Abo, ist laut Anthropic derzeit eine eingeschränkte Beta und funktioniert nur, solange Claude Desktop läuft."
