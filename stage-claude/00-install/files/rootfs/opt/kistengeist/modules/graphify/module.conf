NAME="Graphify (Wissensgraph für Claude Code)"
DESCRIPTION="Skill /graphify für Claude Code: macht aus einem Ordner mit Code, Texten, PDFs oder Bildern einen durchsuchbaren Wissensgraphen (interaktive Ansicht graph.html, Bericht GRAPH_REPORT.md). In Claude Code oder im Terminal-Panel „/graphify .“ eingeben."
GROUP="Claude"
ORDER=57
DEFAULT=on
DEPENDS="claude-code"
NOTE="Braucht rund 200 MB Speicher. Open Source (graphifyy von PyPI). Die Code-Analyse läuft lokal; Texte, PDFs und Bilder wertet Claude über dein Claude-Konto aus (verbraucht Nutzungskontingent). Startet nur, wenn du /graphify eingibst."
