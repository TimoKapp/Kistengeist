# tmux-Einstellungen für das Claude-Code-Terminal von Kistengeist (Server „kistengeist“).
set -g default-terminal "tmux-256color"
set -g mouse on
set -g history-limit 20000
set -s escape-time 10
set -g status-style "bg=#3d3a36,fg=#e8e6e3"
set -g status-left " Claude Code "
set -g status-left-length 20
set -g status-right " Ausblenden: Knopf Terminal · Sitzung läuft weiter "
set -g status-right-length 60
set -g window-status-format ""
set -g window-status-current-format ""
set -g set-clipboard on
# Laut Claude-Code-Doku (Terminal-Einrichtung, tmux): Umschalt+Enter, Benachrichtigungen, Farben.
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features ',xterm*:RGB'
# Keine Präfixtaste: Strg+B braucht Claude Code selbst (Aufgabe in den Hintergrund).
set -g prefix None
unbind C-b
